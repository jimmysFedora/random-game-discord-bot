[project]
name = "random-game-bot"
version = "0.1.0"
description = "Discord bot that picks a random game from a SQLite-backed list"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.7.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
random-game-bot = "random_game_bot.bot:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore:'audioop' is deprecated:DeprecationWarning"]
